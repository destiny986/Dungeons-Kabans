<a class="catalog-icon" title="{{ object.name }}" aria-label="{{ object.name }}{% if quantity %}, {{ quantity }} шт.{% endif %}" data-search="{{ object.search_text }} {{ object.name }} {{ object.description }} {{ object.tags|join:' ' }}" href="{% url 'game:card' kind object.pk %}{% if character %}?character={{ character.pk }}{% endif %}" hx-get="{% url 'game:card' kind object.pk %}{% if character %}?character={{ character.pk }}{% endif %}" hx-target="#dialog-content" data-dialog>{% if object.icon %}<img src="{% url 'game:media' object.icon.digest %}" width="64" height="64" alt="" loading="lazy">{% else %}<span class="icon-fallback" aria-hidden="true">◇</span>{% endif %}{% if quantity > 1 %}<span class="quantity">{{ quantity }}</span>{% endif %}<span class="icon-label">{{ object.name }}</span></a>

<a class="catalog-icon{% if kind == 'item' %} catalog-item-icon{% elif kind == 'action' %} catalog-action-icon{% endif %}" {% if master_catalog_tooltip %}data-catalog-tooltip="{{ object.name }}"{% else %}title="{{ object.name }}"{% endif %} aria-label="{{ object.name }}{% if quantity %}, {{ quantity }} шт.{% endif %}" data-search="{{ object.search_text }} {{ object.name }} {{ object.description }} {{ object.tags|join:' ' }}" href="{% url 'game:card' kind object.pk %}{% if character %}?character={{ character.pk }}{% endif %}" hx-get="{% url 'game:card' kind object.pk %}{% if character %}?character={{ character.pk }}{% endif %}" hx-target="#dialog-content" data-dialog>{% if object.icon %}<img{% if kind == 'item' %} class="item-icon"{% elif kind == 'action' %} class="action-icon"{% endif %} src="{% url 'game:media' object.icon.digest %}" width="64" height="64" alt="" loading="lazy">{% else %}<span class="icon-fallback" aria-hidden="true">◇</span>{% endif %}{% if quantity > 1 %}<span class="quantity">{{ quantity }}</span>{% endif %}{% if not master_catalog_tooltip %}<span class="icon-label">{{ object.name }}</span>{% endif %}</a>

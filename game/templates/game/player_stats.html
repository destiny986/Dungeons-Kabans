{% include 'game/_ability_grid.html' %}
<h2>Черты и свойства
</h2>
<div class="prose trait-note">{{ character.traits|default:'Особые черты ещё не записаны.'|linebreaksbr }}
</div>
<h2>Навыки
</h2>
<dl class="skills-grid">{% for row in skill_rows %}
<div>
<dt>{{ row.label }}
</dt>
<dd>{{ row.value|stringformat:'+d' }}
</dd>
</div>{% endfor %}
</dl>

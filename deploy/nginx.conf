# Dedicated application vhost. Existing 80/8443/443 services stay untouched.
server {
    listen 9443 ssl;
    server_name 185.232.205.216;
    ssl_certificate /etc/letsencrypt/live/185.232.205.216/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/185.232.205.216/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location /_protected_media/ {
        internal;
        alias /srv/dungeons-kabans/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}

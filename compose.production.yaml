name: dungeons-kabans
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the DockerHub image tagged with a commit SHA}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
    env_file:
      - path: ${RUNTIME_ENV_FILE:-/srv/dungeons-kabans/config/runtime.env}
        format: raw
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - /srv/dungeons-kabans/data:/data
      - /srv/dungeons-kabans/media:/media
      - /srv/dungeons-kabans/imports:/imports
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz/',headers={'Host':'185.232.205.216','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

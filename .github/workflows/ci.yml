name: CI and release
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_ENV: local
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-test-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://185.232.205.216:9443
      PUBLIC_BASE_URL: https://185.232.205.216:9443
    steps:
      # Official upstream tags verified with git ls-remote; see deployment docs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ENV: production
      - name: Shell syntax
        run: bash -n deploy/release.sh deploy/release-container.sh deploy/docker-smoke.sh

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build separate test image
        run: docker build --tag dungeons-kabans-ci:${{ github.sha }} .
      - name: Validate Compose without showing resolved secrets
        env:
          APP_IMAGE: dungeons-kabans-ci:${{ github.sha }}
          RUNTIME_ENV_FILE: /tmp/dungeons-compose-ci.env
        run: |
          umask 077
          printf 'DJANGO_ENV=production\nDJANGO_SECRET_KEY=ci-only\n' > "$RUNTIME_ENV_FILE"
          docker compose -f compose.production.yaml config --quiet
      - name: Migrations, bootstrap and Gunicorn health on temporary volumes
        run: bash deploy/docker-smoke.sh dungeons-kabans-ci:${{ github.sha }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [test, docker-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Never cancel a migration or replacement container half way through a release.
    concurrency:
      group: dungeons-kabans-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and push commit-tagged image with isolated registry credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9][a-z0-9_-]{0,38}$ ]]
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'python -c "import os,shutil; shutil.rmtree(os.environ[\"DOCKER_CONFIG\"])"' EXIT
          printf '%s\n' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
          image="$DOCKER_USERNAME/dungeons-kabans:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
      - name: Install runner SSH password transport
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sshpass
      - name: Verify host, stage private config and release once
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python deploy/dispatch.py
